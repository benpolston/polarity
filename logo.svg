<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Polarity logo">
  <!-- Quadrant mark: also used as the "o" in the Polarity wordmark.
       No position dot on purpose: any dot would imply a political lean. -->
  <defs>
    <clipPath id="c"><circle cx="32" cy="32" r="27.5"/></clipPath>
  </defs>
  <g clip-path="url(#c)">
    <rect x="0"  y="0"  width="32" height="32" fill="#ef8f8f"/>
    <rect x="32" y="0"  width="32" height="32" fill="#8fb4f2"/>
    <rect x="0"  y="32" width="32" height="32" fill="#93d493"/>
    <rect x="32" y="32" width="32" height="32" fill="#bf9fe8"/>
    <line x1="32" y1="0" x2="32" y2="64" stroke="#1d1f24" stroke-width="5"/>
    <line x1="0" y1="32" x2="64" y2="32" stroke="#1d1f24" stroke-width="5"/>
  </g>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="#1d1f24" stroke-width="7"/>
</svg>
