<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Compass Detailed logo">
  <defs>
    <clipPath id="r"><rect x="2" y="2" width="60" height="60" rx="14"/></clipPath>
  </defs>
  <g clip-path="url(#r)">
    <rect x="2"  y="2"  width="30" height="30" fill="#ef8f8f"/>
    <rect x="32" y="2"  width="30" height="30" fill="#8fb4f2"/>
    <rect x="2"  y="32" width="30" height="30" fill="#93d493"/>
    <rect x="32" y="32" width="30" height="30" fill="#bf9fe8"/>
    <!-- fine grid -->
    <g stroke="#fff" stroke-opacity=".45" stroke-width="1">
      <line x1="17" y1="2" x2="17" y2="62"/><line x1="47" y1="2" x2="47" y2="62"/>
      <line x1="2" y1="17" x2="62" y2="17"/><line x1="2" y1="47" x2="62" y2="47"/>
    </g>
    <!-- axes -->
    <line x1="32" y1="2" x2="32" y2="62" stroke="#1d1f24" stroke-width="2.4"/>
    <line x1="2" y1="32" x2="62" y2="32" stroke="#1d1f24" stroke-width="2.4"/>
  </g>
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#1d1f24" stroke-width="2.4"/>
  <!-- no position marker on purpose: any dot would imply a political lean -->
</svg>
